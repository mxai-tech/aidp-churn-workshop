title: Workshop AIDP · Churn de clientes
description: "Laboratorio práctico de ingeniería de datos, analítica y machine learning con OCI AI Data Platform."
url: "https://mxai-tech.github.io"
baseurl: "/aidp-churn-workshop"
lang: es-MX

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  pages:
    output: true
    permalink: /:path.html

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

exclude:
  - docs/
  - vendor/
