title: Workshop AIDP · Churn de clientes
description: "Laboratorio práctico de ingeniería de datos, analítica y machine learning con OCI AI Data Platform."
url: "https://mxai-tech.github.io"
baseurl: "/aidp-churn-workshop"
lang: es-MX

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  pages:
    output: true
    permalink: /:path.html

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

exclude:
  - docs/
  - vendor/
  - LICENSE
  - README.md
  - jekyll-theme-satellite.gemspec
  - assets/css/style.scss
  - assets/css/404.scss
  - assets/css/highlight.min.css
  - assets/js/404.js
  - assets/js/background.js
  - assets/js/common.js
  - assets/js/fontfaceobserver.js
  - assets/js/highlight.min.js
  - assets/js/post.js
  - assets/js/subject.js
